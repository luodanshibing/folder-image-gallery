<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Folder Image Gallery · 布局预览</title>
<link rel="stylesheet" href="../plugin/styles.css">
<link rel="stylesheet" href="../styles.css">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px 26px 60px; background: #1e1e22; color: #d7d7dc;
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  h2 { font-size: 14px; color: #c8c8d2; margin: 26px 0 6px; }
  .sub { color: #8b8b96; font-size: 12px; margin-bottom: 8px; }
  .note { color: #8b8b96; font-size: 12px; }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #9a9aa4; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>布局预览（静态）</h1>
<div class="sub">
  同样是插件本体的 <code>GalleryRenderer</code>，只是不自动滚动：用来目测「等高铺满」与「多列瀑布」排得对不对。
  压测请用 <code>stress.html</code>。
</div>
<div class="note" id="log"></div>

<h2>horizontal · 等高弹性铺满（虚拟滚动）</h2>
<div id="g1"></div>

<h2>vertical · 多列保持原比例（虚拟滚动）</h2>
<div id="g2"></div>

<script>
var obsidianStub = {
  Plugin: function () {}, PluginSettingTab: function () {}, Setting: function () {},
  MarkdownRenderChild: function (el) { this.containerEl = el; },
  TFile: function () {}, TFolder: function () {}
};
function require(id) {
  if (id === 'obsidian') return obsidianStub;
  throw new Error('未知模块：' + id);
}
var module = { exports: {} };
var exports = module.exports;
</script>

<script>
/* Obsidian 给 DOM 的便利方法，普通浏览器里补上 */
(function () {
  function apply(el, o) {
    if (!o) return el;
    if (o.cls) el.className = o.cls;
    if (o.text !== undefined && o.text !== null) el.textContent = o.text;
    if (o.title !== undefined && o.title !== null) el.title = o.title;
    if (o.attr) { for (var k in o.attr) el.setAttribute(k, o.attr[k]); }
    return el;
  }
  if (!Element.prototype.empty) Element.prototype.empty = function () { while (this.firstChild) this.removeChild(this.firstChild); return this; };
  if (!Element.prototype.addClass) Element.prototype.addClass = function () { for (var i = 0; i < arguments.length; i++) if (arguments[i]) this.classList.add(arguments[i]); return this; };
  if (!Element.prototype.removeClass) Element.prototype.removeClass = function () { for (var i = 0; i < arguments.length; i++) this.classList.remove(arguments[i]); return this; };
  if (!Element.prototype.createDiv) Element.prototype.createDiv = function (o) { return this.appendChild(apply(document.createElement('div'), o)); };
  if (!Element.prototype.createEl) Element.prototype.createEl = function (tag, o) { return this.appendChild(apply(document.createElement(tag), o)); };
})();
</script>

<script>
(function () {
  'use strict';
  var logEl = document.getElementById('log');
  function log(m) { logEl.textContent += m + '\n'; }

  function loadFirst(list, i, done) {
    if (i >= list.length) { done(new Error('找不到 main.js')); return; }
    var s = document.createElement('script');
    s.src = list[i];
    s.onload = function () { done(null); };
    s.onerror = function () { loadFirst(list, i + 1, done); };
    document.head.appendChild(s);
  }
  loadFirst(['../plugin/main.js', '../main.js', 'main.js'], 0, function (err) {
    if (err || !module.exports.__internals) { log('加载失败：' + (err ? err.message : '无 __internals')); return; }
    render(module.exports.__internals);
  });

  function render(api) {
    var RATIOS = [1.5, 1.33, 0.75, 1.0, 1.78, 0.62, 2.4, 1.2];
    var BANK = 48;
    var urls = [];
    var i = 0;
    (function next() {
      if (i >= BANK) { start(); return; }
      var ratio = RATIOS[i % RATIOS.length];
      var h = 640;
      var w = Math.round(Math.min(2200, Math.max(320, h * ratio)));
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var ctx = c.getContext('2d');
      var hue = (i * 47) % 360;
      var g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, 'hsl(' + hue + ',58%,55%)');
      g.addColorStop(1, 'hsl(' + ((hue + 45) % 360) + ',62%,26%)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.font = 'bold ' + Math.round(h / 5) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), w / 2, h / 2);
      c.toBlob(function (blob) { urls.push(URL.createObjectURL(blob)); i++; next(); }, 'image/jpeg', 0.6);
    })();

    function start() {
      function folder(path, count, offset) {
        var f = new obsidianStub.TFolder();
        f.path = path; f.name = path; f.children = [];
        var now = Date.now();
        for (var k = 0; k < count; k++) {
          var file = new obsidianStub.TFile();
          file.path = path + '/p' + k + '.jpg';
          file.name = 'p' + k + '.jpg';
          file.basename = 'p' + k;
          file.extension = 'jpg';
          file.stat = { mtime: now - k * 1000, ctime: now - k * 1000, size: 1000 + k };
          file.url = urls[(k + offset) % urls.length];
          f.children.push(file);
        }
        return f;
      }
      var folders = {
        '横': folder('横', 240, 0),
        '竖': folder('竖', 240, 3)
      };
      var cache = {};
      var plugin = {
        app: { vault: {
          getFolderByPath: function (p) { return folders[p] || null; },
          getResourcePath: function (f) { return f.url; },
          readBinary: function () { return Promise.reject(new Error('预览页无回退')); }
        } },
        getCachedRatio: function (f) { return cache[f.path] || 0; },
        setCachedRatio: function (f, r) { cache[f.path] = r; },
        trackRenderer: function () {}, forgetRenderer: function () {}
      };
      var only = new URLSearchParams(location.search).get('g') || '';
      var t0 = performance.now();
      if (only !== 'v') {
        var g1 = new api.GalleryRenderer(plugin, document.getElementById('g1'), {
          folder: '横', type: 'horizontal', height: 230, columns: 0, gap: 8,
          sort: 'name', order: 'asc', max: 0, recursive: false, title: ''
        });
        g1.start();
      } else {
        document.querySelectorAll('h2')[0].style.display = 'none';
        document.getElementById('g1').style.display = 'none';
      }
      if (only !== 'h') {
        var g2 = new api.GalleryRenderer(plugin, document.getElementById('g2'), {
          folder: '竖', type: 'vertical', height: 260, columns: 5, gap: 8,
          sort: 'name', order: 'asc', max: 0, recursive: false, title: ''
        });
        g2.start();
      } else {
        document.querySelectorAll('h2')[1].style.display = 'none';
        document.getElementById('g2').style.display = 'none';
      }
      log('画廊渲染耗时 ' + (performance.now() - t0).toFixed(1) + ' ms；'
        + 'DOM 里只有 ' + document.querySelectorAll('.fg-cell').length + ' 个单元格'
        + '（总节点 ' + document.querySelectorAll('*').length + '）。');
      window.__fgDone = true;
    }
  }
})();
</script>
</body>
</html>
